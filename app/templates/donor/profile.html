{% extends "base.html" %}

{% block title %}My Profile &amp; Medical Disclosures{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="stat-icon bg-light text-danger rounded-circle">
                        <i class="bi bi-person-gear fs-3"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0">Donor Profile Settings</h4>
                        <p class="text-muted small mb-0">Keep your contact information and physical health disclosures updated.</p>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('donor.profile') }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email (Permanent)</label>
                            <input type="email" class="form-control" value="{{ current_user.email }}" readonly disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Contact Phone Number</label>
                            <input type="tel" name="phone" class="form-control" value="{{ current_user.phone or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">City</label>
                            <input type="text" name="city" class="form-control" value="{{ current_user.city or '' }}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Address</label>
                            <input type="text" name="address" class="form-control" value="{{ current_user.address or '' }}">
                        </div>
                    </div>

                    <h6 class="text-danger fw-bold text-uppercase mt-4 mb-3">Health &amp; Medical Metrics</h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Blood Group</label>
                            <input type="text" class="form-control fw-bold text-danger" value="{{ profile.blood_group if profile else 'N/A' }}" readonly disabled>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Age (Years)</label>
                            <input type="number" name="age" class="form-control" value="{{ profile.age if profile else '' }}" min="18" max="65">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Weight (kg)</label>
                            <input type="number" step="0.1" name="weight" class="form-control" value="{{ profile.weight if profile else '' }}" min="45">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Medical Disclosures / Chronic Conditions</label>
                            <textarea name="medical_notes" class="form-control" rows="2">{{ profile.medical_notes if profile else '' }}</textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-danger px-4 fw-semibold">
                        <i class="bi bi-save me-1"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
